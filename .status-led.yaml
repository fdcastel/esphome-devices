#
# Custom status led and "Locate" switch.
#

substitutions:
  status_led_output_platform: esp8266_pwm
  status_led_output_pin: GPIO13
  status_led_output_inverted: "True"
  status_led_switch: no_switch

esphome:
  on_boot:
    priority: -10
    then:
      - script.execute: update_status_led

wifi:
  on_connect:
    then:
      - switch.turn_on: wifi_ok
      - script.execute: update_status_led

  on_disconnect:
    then:
      - switch.turn_off: wifi_ok
      - switch.turn_off: api_ok
      - script.execute: update_status_led

api:
  on_client_connected:
    then:
      - switch.turn_on: api_ok
      - script.execute: update_status_led

  on_client_disconnected:
    then:
      - if:
          condition:
            api.connected
          then:
            - switch.turn_on: api_ok
          else:
            - switch.turn_off: api_ok
      - script.execute: update_status_led

output:
  - id: status_led
    platform: ${status_led_output_platform}
    pin: ${status_led_output_pin}
    inverted: ${status_led_output_inverted}

light:
  - id: status_light
    platform: monochromatic
    output: status_led
    internal: True
    effects:
      - pulse:
          name: No WiFi
          transition_length: 200ms
          update_interval: 1800ms
      - pulse:
          name: No API
          transition_length: 200ms
          update_interval: 500ms
      - pulse:
          name: Locate
          transition_length: 1s
          update_interval: 2s

script:
  - id: update_status_led
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: locate
          then:
            - light.turn_on:
                id: status_light
                effect: Locate
          else:
            - if:
                condition:
                  not:
                    switch.is_on: wifi_ok
                then:
                  - light.turn_on:
                      id: status_light
                      effect: No WiFi
                else:
                  - if:
                      condition:
                        not:
                          switch.is_on: api_ok
                      then:
                        - light.turn_on:
                            id: status_light
                            effect: No API
                      else:
                        - if:
                            condition:
                              switch.is_on: ${status_led_switch}
                            then:
                              - light.turn_on:
                                  id: status_light
                                  effect: "None"
                              - light.turn_on:
                                  id: status_light
                                  transition_length: 0s
                            else:
                              - light.turn_off:
                                  id: status_light
                                  transition_length: 0s

switch:
  - id: no_switch    # Dummy switch to make compiler happy.
    platform: template
    internal: True
    optimistic: True

  - id: wifi_ok
    platform: template
    internal: True
    optimistic: True

  - id: api_ok
    platform: template
    internal: True
    optimistic: True

  - id: !extend ${status_led_switch}
    on_turn_on:
      - script.execute: update_status_led

    on_turn_off:
      - script.execute: update_status_led

  - name: Locate
    id: locate
    platform: template
    icon: mdi:home-search
    optimistic: True

    on_turn_on:
      - script.execute: update_status_led

    on_turn_off:
      - script.execute: update_status_led
