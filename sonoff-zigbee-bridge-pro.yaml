#
# Device-specific: Sonoff Zigbee Bridge PRO, raw serial over TCP.
#
# ZHA connects to `socket://<host>:6638` (radio type znp, 115200). This is also the transport
# for radio firmware updates: press "Zigbee Bootloader", then run cc2538-bsl against the same
# socket. ESPHome's native alternative is sonoff-zigbee-bridge-pro-proxy.yaml.
#
# Built-in uart_tcp (ESPHome 2026.10+) replaces oxan/esphome-stream-server, whose master no
# longer compiles (network::get_use_address() was removed in ESPHome 2026.7).
#

packages:
  core: !include .sonoff-zigbee-bridge-pro-core.yaml

uart_tcp:
  - id: zb_tcp
    uart_id: uart_bus
    role: server
    port: 6638

binary_sensor:
  - platform: uart_tcp
    uart_tcp_id: zb_tcp
    connected:
      name: Connected

sensor:
  - platform: uart_tcp
    uart_tcp_id: zb_tcp
    disconnects:
      name: Disconnects
